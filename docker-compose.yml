version: "3.9"

# Pinned explicitly. Without this, Compose derives the project name from the
# containing directory, so renaming or moving the repo silently creates a new
# project with new, EMPTY volumes while the real data stays behind in the old
# one (e.g. claude-test_pgdata). Keep this value stable.
name: utility-cis

services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: utility_cis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once on first container init to provision the application
      # role `cis` that DATABASE_URL expects. Idempotent on re-runs.
      - ./docker/init-cis-user.sh:/docker-entrypoint-initdb.d/init-cis-user.sh:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
